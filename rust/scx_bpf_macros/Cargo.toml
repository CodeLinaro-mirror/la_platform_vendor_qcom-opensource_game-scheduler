[package]
name = "scx_bpf_macros"
version = "1.1.4"
edition = "2024"
description = "The macros of scx_bpf, the sched_ext runtime for Rust BPF schedulers"
license = "GPL-2.0-only"
authors = ["Andrea Righi <arighi@nvidia.com>"]
repository = "https://github.com/sched-ext/scx"
homepage = "https://github.com/sched-ext/scx"
publish = false

# A dependency of scx_bpf, built with it by a scheduler's build script, so
# not a member of the scx workspace.
[workspace]

[lib]
proc-macro = true

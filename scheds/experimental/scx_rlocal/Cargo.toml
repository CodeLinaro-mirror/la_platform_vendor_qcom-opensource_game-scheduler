[package]
name = "scx_rlocal"
version = "1.1.4"
edition = "2024"
license = "GPL-2.0-only"
description = "A per-CPU queue sched_ext scheduler written in Rust BPF on scx_bpf"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
scx_bpf_loader = { path = "../../../rust/scx_bpf_loader", version = "1.1.4" }

[build-dependencies]
scx_bpf_build = { path = "../../../rust/scx_bpf_build", version = "1.1.4" }

# CI has no Rust BPF toolchain, and builds scx_rlocal without its BPF
# objects.
[package.metadata.veristat]
disable = true
